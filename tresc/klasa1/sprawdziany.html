<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprawdziany z informatyki</title>
<style>
:root{--bg:#fff;--panel:#f3f5f7;--ink:#1c2631;--mute:#5b6773;--line:#d9dee3;--acc:#e8711a;--ok:#12805c;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b22;--panel:#1d262f;--ink:#e8edf2;--mute:#9aa7b3;--line:#2d3945;--ok:#3ec79a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#141b22;--panel:#1d262f;--ink:#e8edf2;--mute:#9aa7b3;--line:#2d3945;--ok:#3ec79a;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.2rem}h1{font-size:1.5em;margin:.2em 0 .6em}
button,input{font:inherit;font-size:.9em;border:1px solid var(--line);border-radius:6px;padding:.45em .9em;background:var(--panel);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.t{display:block;width:100%;text-align:left;margin:.4rem 0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin:1rem 0}.q p{margin:.1rem 0 .5rem;font-weight:700}
label.o{display:flex;gap:.6rem;align-items:flex-start;padding:.3rem .2rem;cursor:pointer}label.o input{margin-top:.35em;width:1.1em;height:1.1em;accent-color:var(--acc)}
.r{background:var(--panel);border-left:6px solid var(--acc);border-radius:6px;padding:.6rem 1rem;margin:.8rem 0}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.mute{color:var(--mute);font-size:.85em}
.o.ok span{color:var(--ok);font-weight:700}.o.no span{color:var(--bad)}
.msg{color:var(--bad);min-height:1.5em}
</style></head><body><main id="app"></main>

async function dec(b64,pw){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));
}

}
function ask(i){
  app.innerHTML=`<h1>${TESTS[i][1]}</h1><p>Wpisz hasło od nauczyciela.</p><p><input id="pw" type="password" autocomplete="off" aria-label="Hasło"> <button class="p" id="go">Odblokuj</button> <button id="bk">Wróć</button></p><p class="msg" id="msg" aria-live="polite"></p>`;
  $("#bk").onclick=home;
  const go=async()=>{
    $("#msg").textContent="Sprawdzam...";
    try{const d=await dec(TESTS[i][2],$("#pw").value.trim());intro(d)}
    catch(e){$("#msg").textContent="Nieprawidłowe hasło."}
  };
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};$("#pw").focus();
}
function intro(d){
  app.innerHTML=`<h1>${esc(d.title)}</h1><p>${d.qs.length} pytań. Po wybraniu odpowiedzi kliknij „Zakończ i sprawdź”. W pytaniach „Wskaż zdania prawdziwe” może być kilka poprawnych odpowiedzi. Punkt dostajesz tylko za pełną, poprawną odpowiedź.</p><p><input id="nm" placeholder="Imię i nazwisko" aria-label="Imię i nazwisko"> <select id="kl" aria-label="Klasa" style="font:inherit;font-size:.9em;padding:.45em;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)"><option value="">Wybierz klasę…</option><optgroup label="Klasy 1"><option>1A</option><option>1B</option><option>1C</option><option>1D</option><option>1E</option><option>1F</option></optgroup><optgroup label="Klasy 2"><option>2A</option><option>2B</option><option>2C</option><option>2D</option><option>2E</option><option>2F</option></optgroup><optgroup label="Klasy 3"><option>3A</option><option>3B</option><option>3C</option><option>3D</option><option>3E</option><option>3F</option></optgroup></select> <button class="p" id="st">Rozpocznij</button></p><p class="msg" id="msg"></p>`;
  $("#st").onclick=()=>{const n=$("#nm").value.trim(),k=$("#kl").value;if(!n){$("#msg").textContent="Wpisz imię i nazwisko.";return}if(!k){$("#msg").textContent="Wybierz klasę.";return}run(d,n,k)};
}
function run(d,name,kl){
  const qs=shuf(d.qs).map(q=>({...q,ord:shuf(q.o.map((_,i)=>i))}));
  app.innerHTML=`<h1>${esc(d.title)}</h1><p class="mute">${esc(name)}</p>`+qs.map((q,qi)=>`<div class="q"><p>${qi+1}. ${esc(q.q)}${q.m?' <span class="mute">(może być kilka poprawnych)</span>':''}</p>`+q.ord.map(oi=>`<label class="o"><input type="${q.m?"checkbox":"radio"}" name="q${qi}" value="${oi}"><span>${esc(q.o[oi])}</span></label>`).join("")+`</div>`).join("")+`<p><button class="p" id="fin">Zakończ i sprawdź</button></p><p class="msg" id="msg"></p>`;
  $("#fin").onclick=()=>{
    const ans=qs.map((q,qi)=>[...app.querySelectorAll(`input[name=q${qi}]:checked`)].map(x=>+x.value));
    if(ans.some(a=>!a.length)&&!confirm("Nie na wszystkie pytania odpowiedziano. Zakończyć mimo to?"))return;
    result(d,name,qs,ans,kl);
  };
}
function result(d,name,qs,ans,kl){
  let sc=0;const bad=[];
  const body=qs.map((q,qi)=>{
    const a=ans[qi].slice().sort().join(),c=q.a.slice().sort().join(),ok=a===c;if(ok)sc++;else bad.push(qi+1);
    return `<div class="q"><p>${qi+1}. ${esc(q.q)} <span class="${ok?"good":"bad"}">${ok?"Dobrze":"Źle"}</span></p>`+q.ord.map(oi=>{const isC=q.a.includes(oi),isS=ans[qi].includes(oi);return `<div class="o ${isC?"ok":(isS?"no":"")}"><span>${isC?"✔ ":(isS?"✘ ":"· ")}${esc(q.o[oi])}</span></div>`}).join("")+`<p class="mute">${esc(q.why)}</p></div>`;
  }).join("");
  const pct=Math.round(sc/qs.length*100),now=new Date().toLocaleString("pl-PL");
  const RURL="https://script.google.com/macros/s/AKfycbzGvnKlock74eu0ptTr8Dy7O7BKdnQBL2V8B9vFoSWcl80k3ZLd06R1tBz8m82dQPKySw/exec";let sent="";
  try{fetch(RURL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({t:"test",n:name,k:kl,x:d.title,s:sc,m:qs.length,w:bad.join(", ")})});sent=" Wynik wysłano do nauczyciela."}catch(e){sent=" Nie udało się wysłać wyniku – pokaż ten ekran nauczycielowi."}
  app.innerHTML=`<h1>Wynik</h1><div class="r"><b>${esc(name)}</b> (${esc(kl||"")})<br>${esc(d.title)}<br>Wynik: <b>${sc} / ${qs.length}</b> (${pct}%)<br><span class="mute">${now}. Pokaż ten ekran nauczycielowi.${sent}</span></div>`+body+`<p><button id="bk">Zakończ</button></p>`;
  $("#bk").onclick=home;
}
home();
</script></body></html>
