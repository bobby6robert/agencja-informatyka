<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel nauczyciela – Agencja</title>
<style>
:root{--tlo:#f4f6fb;--panel:#fff;--tekst:#14213d;--mute:#5b6478;--akc:#fca311;--nav:#14213d;--linia:#e2e6ef;--ok:#15803d;--zle:#b91c1c}
@media (prefers-color-scheme:dark){:root{--tlo:#0e1628;--panel:#16213e;--tekst:#eef2f8;--mute:#a9b4c8;--linia:#2a3858}}
*{box-sizing:border-box}
body{margin:0;background:var(--tlo);color:var(--tekst);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--nav);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{color:var(--akc);text-transform:uppercase;letter-spacing:.05em}
main{max-width:1200px;margin:0 auto;padding:16px}
.karta{background:var(--panel);border:1px solid var(--linia);border-radius:12px;padding:16px;margin:12px 0}
button,input,select{font:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid var(--linia);background:var(--panel);color:var(--tekst);padding:.45em .9em}
.glowny{background:var(--akc);border:0;color:#111;font-weight:700}
input,select{padding:.45em .6em;border:1px solid var(--linia);border-radius:8px;background:var(--panel);color:var(--tekst)}
.zakladki{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.zakladki button[aria-pressed=true]{background:var(--nav);color:#fff;border-color:var(--nav)}
.przewin{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.45em .55em;border-bottom:1px solid var(--linia);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr.klik{cursor:pointer}tr.klik:hover td{background:color-mix(in srgb,var(--akc) 12%,transparent)}
.oc{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;border-radius:6px;padding:0 .3em;background:color-mix(in srgb,var(--akc) 30%,transparent)}
.mute{color:var(--mute);font-size:.85em}
.blad{color:var(--zle)}
.haslo{font-family:Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.12em}
.ukryte{filter:blur(6px);cursor:pointer}
.szczeg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pasek{height:8px;background:var(--linia);border-radius:4px;overflow:hidden;min-width:80px}
.pasek i{display:block;height:100%;background:var(--akc)}
</style>
</head>
<body>
<header><b>Agencja</b><span>Panel nauczyciela</span><span style="flex:1"></span><span id="stan" class="mute" style="color:#cbd5e1"></span></header>
<main id="app"></main>
<script src="../tresc/klasa1/gra/fabula.js"></script>
<script src="../tresc/klasa1/gra/fabula-mundur.js"></script>
<script src="../tresc/klasa1/gra/rozdzial2.js"></script>
<script src="../tresc/klasa2/gra/fabula.js"></script>
<script src="../tresc/klasa2/gra/rozdzial1.js"></script>
<script>
(function(){
"use strict";
let rocz="1";try{rocz=sessionStorage.getItem("agencja-rocznik")||"1"}catch(e){}
const F=new Proxy({},{get:(t,p)=>(window.FABULY[rocz]||window.FABULY[1])[p]});   // fabuła wybranej klasy (rocznika)
let API="https://script.google.com/macros/s/AKfycbzGvnKlock74eu0ptTr8Dy7O7BKdnQBL2V8B9vFoSWcl80k3ZLd06R1tBz8m82dQPKySw/exec";
try{const q=new URLSearchParams(location.search).get("api");if(q&&/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(q))API=q}catch(e){}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
let D=null,D0=null,haslo="",zak="uczniowie",filtr="";
const wRoczniku=x=>String(x.k||"")[0]===rocz;
const filtruj=()=>Object.assign({},D0,{gracze:(D0.gracze||[]).filter(wRoczniku),klasy:(D0.klasy||[]).filter(wRoczniku),wyniki:(D0.wyniki||[]).filter(w=>!w.k||wRoczniku(w))});
try{haslo=sessionStorage.getItem("agencja-panel")||""}catch(e){}

async function api(a,d){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},d,{a}))});const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error("stary")}}
const stopien=xp=>{let i=0;F.progi.forEach((p,j)=>{if(xp>=p)i=j});return F.motywy.det.stopnie[i]};
const data=s=>s?new Date(s).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
const etyk=k=>k.k+(k.g?" gr "+k.g:"");
const wGrupie=(g,k)=>g.k===k.k&&String(g.g||"")===String(k.g||"");
function stanUcznia(g){try{return JSON.parse(g.stan||"{}")}catch(e){return {}}}

function logowanie(msg){
  app.innerHTML=`<div class="karta" style="max-width:420px;margin:40px auto"><h2>Logowanie</h2>
  <p class="mute">Hasło ustawiasz w arkuszu Google, karta „Ustawienia”, komórka B1.</p>
  <form><p><input type="password" name="h" placeholder="Hasło nauczyciela" autocomplete="current-password" style="width:100%"></p>
  <p><button class="glowny">Zaloguj</button></p><p class="blad">${esc(msg||"")}</p></form></div>`;
  const f=$("form");f.h.focus();
  f.onsubmit=e=>{e.preventDefault();haslo=f.h.value;wczytaj()};
}
async function wczytaj(){
  $("#stan").textContent="Wczytuję…";
  try{
    const r=await api("panel",{haslo});
    if(!r.ok){$("#stan").textContent="";return logowanie({haslo:"Złe hasło.",brakHasla:"Najpierw wpisz hasło w arkuszu (karta „Ustawienia”, komórka B1).",blokada:"Za dużo prób. Odczekaj 10 minut."}[r.e]||"Błąd logowania.")}
    try{sessionStorage.setItem("agencja-panel",haslo)}catch(e){}
    D0=r;D=filtruj();$("#stan").textContent="Odświeżono "+new Date().toLocaleTimeString("pl-PL");rysuj();
  }catch(e){$("#stan").textContent="";logowanie(e.message==="stary"?"Skrypt w arkuszu nie jest jeszcze zaktualizowany (instrukcja w folderze DLA-NAUCZYCIELA).":"Brak połączenia z arkuszem.")}
}

function rysuj(){
  const odd=[...new Set(D.gracze.map(g=>g.k))].sort();
  app.innerHTML=`<div class="zakladki">${Object.keys(window.FABULY).map(r=>`<button data-rocz="${r}" aria-pressed="${rocz===r}">Klasa ${r}</button>`).join("")}<span style="width:14px"></span>${[["uczniowie","Uczniowie"],["zalegle","Zaległości"],["sprawdz","📝 Do sprawdzenia"+(doSprawdzenia().length?` (${doSprawdzenia().length})`:"")],["klasy","Klasy i kody"],["wyniki","Wyniki testów"],["hasla","Hasła do testów"]].map(([k,n])=>`<button data-z="${k}" aria-pressed="${zak===k}">${n}</button>`).join("")}
  <span style="flex:1"></span><a href="../prowadzenie/${location.search}" target="_blank" rel="noopener" style="align-self:center;margin-right:8px">🎓 Prowadzenie lekcji ↗</a><button data-odsw>⟳ Odśwież</button><button data-wyl>Wyloguj</button></div><div id="tresc"></div>`;
  $$("[data-z]").forEach(b=>b.onclick=()=>{zak=b.dataset.z;rysuj()});
  $$("[data-rocz]").forEach(b=>b.onclick=()=>{rocz=b.dataset.rocz;try{sessionStorage.setItem("agencja-rocznik",rocz)}catch(e){}D=filtruj();filtr="";rysuj()});
  $("[data-odsw]").onclick=wczytaj;
  $("[data-wyl]").onclick=()=>{haslo="";try{sessionStorage.removeItem("agencja-panel")}catch(e){}D=null;logowanie()};
  const t=$("#tresc");
  if(zak==="uczniowie")uczniowie(t,odd);
  if(zak==="klasy")klasy(t);
  if(zak==="wyniki")wyniki(t);
  if(zak==="hasla")hasla(t);
  if(zak==="zalegle")zalegle(t);
  if(zak==="sprawdz")sprawdz(t);
}

/* ---------- zadania otwarte z kartkówek i sprawdzianów w grze (ocenia nauczyciel) ---------- */
function doSprawdzenia(wszystkie){   // [{g, s, e, t}] – testy z zadaniami otwartymi (domyślnie tylko nieocenione)
  const out=[];
  D.gracze.forEach(g=>{const s=stanUcznia(g);Object.entries(s.testy||{}).forEach(([id,t])=>{
    if(!t.otw)return;const e=F.etapy.find(x=>x.id===id);if(!e)return;
    if(wszystkie||Object.values(t.otw).some(o=>o.p==null))out.push({g,s,e,t})})});
  return out.sort((a,b)=>String(a.g.k).localeCompare(String(b.g.k))||String(a.g.n).localeCompare(String(b.g.n),"pl"));
}
let pokazOcenione=false;
function sprawdz(t){
  const lista=doSprawdzenia(pokazOcenione).filter(x=>!filtr||x.g.k===filtr);
  t.innerHTML=`<div class="karta"><p class="mute">Odpowiedzi na zadania otwarte z kartkówek i sprawdzianów w grze. Wpisz punkty i zapisz – ocena ucznia przeliczy się sama.
    Zadania „z danymi komputera” trafiają tu, gdy uczeń pisał poza aplikacją.</p><label><input type="checkbox" id="pokOc" ${pokazOcenione?"checked":""}> pokaż też już ocenione</label></div>
    ${lista.map((x,i)=>`<div class="karta"><h3>${esc(x.g.n)} <span class="mute">· ${esc(x.g.k)}${x.g.g?" gr "+esc(x.g.g):""} · ${esc(x.e.tytul.det)}${x.t.gr?" · gr. "+esc(x.t.gr):""} · teraz ${x.t.s}/${x.t.m} → ${ocenaTestu(x.t.s,x.t.m)}</span></h3>
      ${Object.entries(x.t.otw).map(([q,o])=>`<div style="border-top:1px solid var(--linia,#ddd);padding:8px 0"><p><b>${esc(o.q)}</b> <span class="mute">(max ${o.m} pkt)</span></p>
        ${o.kryt?`<p class="mute">Kryteria: ${esc(o.kryt)}</p>`:""}<blockquote style="margin:6px 0;padding:8px 12px;background:color-mix(in srgb,var(--nav,#36c) 8%,transparent);border-radius:8px;white-space:pre-wrap">${esc(o.odp)||"<i>brak odpowiedzi</i>"}</blockquote>
        <p>Punkty: ${Array.from({length:o.m+1},(_,p)=>`<label style="margin-right:10px"><input type="radio" name="o${i}-${esc(q)}" value="${p}" ${o.p===p?"checked":""}> ${p}</label>`).join("")}</p></div>`).join("")}
      <p><button data-zo="${i}">Zapisz punkty</button> <span class="mute" id="st${i}"></span></p></div>`).join("")||`<div class="karta mute">Nic nie czeka na sprawdzenie. 🎉</div>`}`;
  $("#pokOc").onchange=e=>{pokazOcenione=e.target.checked;sprawdz(t)};
  $$("[data-zo]",t).forEach(b=>b.onclick=async()=>{const i=+b.dataset.zo,x=lista[i],pkt={};
    Object.keys(x.t.otw).forEach(q=>{const r=t.querySelector(`input[name="o${i}-${CSS.escape(q)}"]:checked`);if(r)pkt[q]=+r.value});
    if(!Object.keys(pkt).length)return $("#st"+i).textContent="Zaznacz punkty.";
    const r=await akcja("ocenOtwarte",{n:x.g.n,k:x.g.k,etap:x.e.id,pkt},$("#st"+i));
    if(r)await wczytaj()});
}

function ocenaTestu(sk,mx){const p=Math.round((+sk||0)/(+mx||1)*100);for(const [g,o] of F.skalaTestow)if(p>=g-1e-9)return o;return "1"}
function poza(e,s){const n=(s.alarmy||[]).filter(a=>a.id===e.id).length;return n?` <span class="blad" title="Wyjścia z okna gry w czasie tego etapu (na lekcji)">⚠${n}</span>`:""}
function komorka(e,s){
  if(e.typ==="test"){const r=(s.testy||{})[e.id];return r?`<span class="oc">${ocenaTestu(r.s,r.m)}</span> <span class="mute">${r.s}/${r.m} · ${r.proc}%</span>${r.doOceny?` <span title="Zadania otwarte czekają na sprawdzenie (zakładka Do sprawdzenia)">📝</span>`:""}${r.kara?` <span class="blad" title="${esc(r.kara)} – ocena 1. Bez kary: ${r.sPrzedKara}/${r.m}">⛔</span> <button data-kara="${esc(e.id)}" title="Cofnij karę (np. awaria komputera)">cofnij</button>`:""}${poza(e,s)}`:"–"}
  const r=(s.misje||{})[e.id];if(!r)return "–";
  if(e.bezPoziomu)return `${r.proc}%`;
  const pop=r.proby&&r.proby.length>1?` · popr. ×${r.proby.length-1}`:"";
  return `<span class="oc">${r.ocena}</span> <span class="mute">${esc(F.poziomy[r.poziom].n)} · ${r.proc}%${r.podp?` · 💡${r.podp}`:""}${pop}</span>${poza(e,s)}`;
}
async function akcja(a,d,st){
  if(st)st.textContent="Zapisuję…";
  try{const r=await api(a,Object.assign({haslo},d));
    if(r.ok){if(st)st.textContent="✔ gotowe";return r}
    if(st)st.textContent=r.e==="akcja"?"Zaktualizuj skrypt w arkuszu.":r.e==="zmiana"?"Arkusz się zmienił – odśwież panel.":r.e==="zajety"?"Arkusz zajęty – spróbuj ponownie za chwilę.":"Błąd: "+r.e;return null}
  catch(e){if(st)st.textContent=e.message==="stary"?"Zaktualizuj skrypt w arkuszu.":"Brak połączenia.";return null}
}
function uczniowie(t,odd){
  const lista=D.gracze.filter(g=>!filtr||g.k===filtr).sort((a,b)=>a.k.localeCompare(b.k)||String(a.n).localeCompare(String(b.n),"pl"));
  t.innerHTML=`<div class="karta"><p><label>Oddział: <select id="f"><option value="">wszystkie</option>${odd.map(k=>`<option ${k===filtr?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
  <button id="csv">⬇ Pobierz CSV (Excel)</button> <span class="mute">${lista.length} uczniów · kliknij wiersz, aby zobaczyć szczegóły</span></p>
  ${(()=>{const bez=lista.filter(g=>!g.g&&D.klasy.some(k=>k.k===g.k&&k.g));return bez.length?`<p class="blad" style="font-weight:700">⚠ ${bez.length} uczniów bez przypisanej grupy – odblokowania z „Prowadzenia lekcji” ich nie obejmują. Wybierz grupę w kolumnie „Grupa” albo <button id="autoGr">🪄 Przypisz grupy wg planu lekcji</button></p>`:""})()}
  <div id="autoBox"></div>
  <p class="mute">Ocena przy misji to propozycja wg poziomu (Rekrut do 4, Agent do 5, Elita do 6); po poprawie na wyższym poziomie zostaje najwyższa. Kartkówka i sprawdzian wg skali szkolnej. 💡 = liczba podpowiedzi.</p>
  <div class="przewin"><table><tr><th>Uczeń</th><th>Oddział</th><th>Grupa</th><th>XP</th><th>Stopień</th>${F.etapy.map(e=>`<th>${esc(e.tytul.det)}</th>`).join("")}<th>Ostatnio</th></tr>
  ${lista.map((g,i)=>{const s=stanUcznia(g);return `<tr class="klik" data-i="${D.gracze.indexOf(g)}"><td><b>${esc(g.n)}</b></td><td>${esc(g.k)}</td><td>${(()=>{const gr=[...new Set(D.klasy.filter(k=>k.k===g.k&&k.g).map(k=>k.g))].sort();return gr.length?`<select data-grupa="${D.gracze.indexOf(g)}" title="Grupa ucznia" style="${g.g?"":"border-color:var(--zle);color:var(--zle)"}"><option value="" ${g.g?"":"selected"}>brak!</option>${gr.map(x=>`<option ${x===String(g.g||"")?"selected":""}>${esc(x)}</option>`).join("")}</select>`:esc(g.g||"–")})()}</td><td>${+g.xp||0}</td><td>${esc(stopien(+g.xp||0))}</td>${F.etapy.map(e=>`<td>${komorka(e,s)}</td>`).join("")}<td class="mute">${data(g.ost)}</td></tr>`}).join("")}
  </table></div></div><div id="szczeg"></div>`;
  $("#f").onchange=e=>{filtr=e.target.value;rysuj()};
  $$("tr.klik",t).forEach(r=>r.onclick=async e=>{if(e.target.closest("select"))return;
    const kb=e.target.closest("[data-kara]");   // cofnięcie kary za 3 wyjścia z gry w teście
    if(kb){const g=D.gracze[+r.dataset.i];if(!confirm(`Cofnąć karę w teście dla: ${g.n}? Wynik wróci do punktów bez kary.`))return;
      kb.disabled=true;if(await akcja("ocenOtwarte",{n:g.n,k:g.k,etap:kb.dataset.kara,cofnijKare:true,pkt:{}}))await wczytaj();return}
    szczegoly(D.gracze[+r.dataset.i])});
  const ag=$("#autoGr",t);if(ag)ag.onclick=()=>autoGrupy(lista);
  $$("[data-grupa]",t).forEach(sel=>{sel.onclick=e=>e.stopPropagation();sel.onchange=async()=>{const g=D.gracze[+sel.dataset.grupa];
    if(await akcja("ustawGrupe",{n:g.n,k:g.k,g:sel.value},null)){g.g=sel.value;sel.style.cssText=sel.value?"":"border-color:var(--zle);color:var(--zle)"}else{alert("Nie udało się zapisać grupy (zaktualizuj skrypt w arkuszu albo spróbuj ponownie).");sel.value=g.g||""}}});
  $("#csv").onclick=()=>{
    const wiersze=[["Uczeń","Oddział","XP",...F.etapy.flatMap(e=>e.typ==="test"?[e.tytul.det+" pkt",e.tytul.det+" max",e.tytul.det+" ocena"]:e.bezPoziomu?[e.tytul.det+" %"]:[e.tytul.det+" poziom",e.tytul.det+" %",e.tytul.det+" ocena",e.tytul.det+" podpowiedzi"])]];
    lista.forEach(g=>{const s=stanUcznia(g);wiersze.push([g.n,g.k,g.xp,...F.etapy.flatMap(e=>{if(e.typ==="test"){const r=(s.testy||{})[e.id];return r?[r.s,r.m,ocenaTestu(r.s,r.m)]:["","",""]}const r=(s.misje||{})[e.id];if(e.bezPoziomu)return [r?r.proc:""];return r?[F.poziomy[r.poziom].n,r.proc,r.ocena,r.podp]:["","","",""]})])});
    const csv="﻿"+wiersze.map(w=>w.map(x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`agencja-wyniki${filtr?"-"+filtr:""}.csv`;a.click();
  };
}
const grPlanu=t=>{const m=/^(\d)([a-z]+?)l?(\d)\/(\d)$/i.exec(String(t||"").trim());return m?{k:(m[1]+m[2]).toUpperCase(),g:m[3]}:null};
const minut=t=>{const m=/(\d{1,2}):(\d{2})/.exec(t);return m?+m[1]*60+ +m[2]:0};
function czasyUcznia(s){   // momenty aktywności ucznia zapisane w postępie
  const t=[];
  Object.values(s.misje||{}).forEach(m=>{(m.proby||[m]).forEach(p=>{if(p.data)t.push(p.data)})});
  Object.values(s.testy||{}).forEach(x=>{if(x.data)t.push(x.data)});
  if(s.trwa&&s.trwa.t)t.push(new Date(s.trwa.t).toISOString());
  return t.map(x=>new Date(x)).filter(d=>!isNaN(d));
}
function wykryjGrupe(g,s){
  const glosy={},lekcje=[];
  czasyUcznia(s).forEach(d=>{
    const dz=d.getDay(),min=d.getHours()*60+d.getMinutes();
    (D.plan||[]).forEach(p=>{const gr=grPlanu(p.gr);if(!gr||gr.k!==g.k||p.d!==dz)return;
      const [od,doo]=p.godz.split(/[–-]/).map(minut);
      if(min>=od-10&&min<=doo+15){glosy[gr.g]=(glosy[gr.g]||0)+1;lekcje.push(`${["","pn","wt","śr","czw","pt"][dz]} ${p.godz}`)}});
  });
  const naj=Object.entries(glosy).sort((a,b)=>b[1]-a[1])[0];
  return {g:naj?naj[0]:"",lekcje:[...new Set(lekcje)]};
}
function nadmiarowe(s,kl){   // etapy zrobione ponad odblokowanie grupy
  if(!kl||!kl.od)return [];
  const oi=F.etapy.findIndex(e=>e.id===kl.od);
  return F.etapy.filter((e,i)=>i>oi&&(e.typ==="test"?(s.testy||{})[e.id]:(s.misje||{})[e.id]));
}
function autoGrupy(lista){
  const box=$("#autoBox"),bez=lista.filter(g=>!g.g&&D.klasy.some(k=>k.k===g.k&&k.g));
  const wiersze=bez.map(g=>{const s=stanUcznia(g),w=wykryjGrupe(g,s);return {g,s,w}});
  const grupy=k=>[...new Set(D.klasy.filter(x=>x.k===k&&x.g).map(x=>x.g))].sort();
  box.innerHTML=`<div class="karta"><h3>Przypisanie grup wg planu lekcji</h3>
    <p class="mute">Grupa wykryta z godzin, w których uczeń robił misje, porównanych z planem. Zaznaczone etapy zostaną usunięte, bo uczeń zrobił je, zanim były odblokowane dla jego grupy (zrobi je ponownie po odblokowaniu). Sprawdź i popraw przed zastosowaniem.</p>
    <div class="przewin"><table><tr><th>Uczeń</th><th>Aktywność w czasie lekcji</th><th>Grupa</th><th>Usuń wyniki (zrobione przed odblokowaniem)</th></tr>
    ${wiersze.map((x,i)=>`<tr data-r="${i}"><td><b>${esc(x.g.n)}</b> <span class="mute">${esc(x.g.k)}</span></td>
      <td class="mute" style="white-space:normal">${x.w.lekcje.length?esc(x.w.lekcje.join(", ")):"nie rozpoznano – wybierz ręcznie"}</td>
      <td><select data-ag>${`<option value="">–</option>`+grupy(x.g.k).map(v=>`<option ${v===x.w.g?"selected":""}>${esc(v)}</option>`).join("")}</select></td>
      <td data-nad style="white-space:normal"></td></tr>`).join("")}</table></div>
    <p><button class="glowny" id="agZast">Zastosuj</button> <button id="agAnul">Anuluj</button> <span class="mute" id="agSt"></span></p></div>`;
  const nad=tr=>{const x=wiersze[+tr.dataset.r],v=$("[data-ag]",tr).value,kl=D.klasy.find(k=>k.k===x.g.k&&k.g===v);
    const n=nadmiarowe(x.s,kl);$("[data-nad]",tr).innerHTML=n.length?n.map(e=>`<label style="display:block"><input type="checkbox" data-del="${e.id}" checked> ${esc(e.lekcja||e.tytul.det)}</label>`).join(""):`<span class="mute">${v?"nic":"wybierz grupę"}</span>`};
  $$("tr[data-r]",box).forEach(tr=>{nad(tr);$("[data-ag]",tr).onchange=()=>nad(tr)});
  $("#agAnul").onclick=()=>{box.innerHTML=""};
  $("#agZast").onclick=async()=>{
    const zad=$$("tr[data-r]",box).map(tr=>({x:wiersze[+tr.dataset.r],g:$("[data-ag]",tr).value,del:$$("[data-del]:checked",tr).map(c=>c.dataset.del)})).filter(z=>z.g);
    if(!zad.length){$("#agSt").textContent="Nie wybrano żadnej grupy.";return}
    const ileDel=zad.reduce((a,z)=>a+z.del.length,0);
    if(!confirm(`Przypisać grupy ${zad.length} uczniom${ileDel?` i usunąć ${ileDel} wyników etapów`:""}?`))return;
    $("#agZast").disabled=true;let ok=0,bl=0;
    for(const z of zad){
      $("#agSt").textContent=`Zapisuję… ${ok+bl+1}/${zad.length}`;
      const r1=await akcja("ustawGrupe",{n:z.x.g.n,k:z.x.g.k,g:z.g},null);
      let r2=true;for(const id of z.del){if(!(await akcja("resetEtapu",{n:z.x.g.n,k:z.x.g.k,etap:id},null)))r2=false}
      r1&&r2?ok++:bl++;
    }
    $("#agSt").textContent=`✔ Gotowe: ${ok}${bl?`, błędy: ${bl} (spróbuj ponownie)`:""}. Odświeżam…`;
    await wczytaj();
  };
}
function szczegoly(g){
  const s=stanUcznia(g),M=F.motywy[s.motyw||"det"]||F.motywy.det;
  const b=$("#szczeg");
  const proby=r=>r.proby&&r.proby.length>1?`<br><span class="mute">Podejścia: ${r.proby.map(p=>`${esc(F.poziomy[p.poziom].n)} ${p.proc}% → ${p.ocena}`).join("; ")}</span>`:"";
  b.innerHTML=`<div class="karta"><h2>${esc(g.n)} <span class="mute">${esc(g.k)}${g.g?" gr "+esc(g.g):""}</span></h2>
  <div class="szczeg"><div><b>Klimat:</b> ${esc(M.nazwa)}<br><b>XP:</b> ${+g.xp||0} (${esc(stopien(+g.xp||0))})<br><b>Karty:</b> ${(s.karty||[]).length}/${Object.keys(F.karty).length}<br><b>Zagadki dodatkowe:</b> ${F.etapy.filter(e=>e.zagadka&&(s.zagadki||{})[e.id]).length}/${F.etapy.filter(e=>e.zagadka).length}<br><b>Wyzwania tygodnia:</b> ${Object.keys(s.wyzwania||{}).length}<br><b>Ostatnio:</b> ${data(g.ost)}
    <p style="margin-top:1em"><button data-pin>🔑 Resetuj PIN</button> <button data-usun style="color:var(--zle)">🗑 Usuń ucznia</button></p><p class="mute" data-st></p></div>
  <div>${F.etapy.map(e=>{const r=e.typ==="test"?(s.testy||{})[e.id]:(s.misje||{})[e.id];
    return `<div style="margin-bottom:.5em"><b>${esc(e.tytul.det)}:</b> ${r?(e.typ==="test"?`${r.s}/${r.m} (${r.proc}%), ocena ${ocenaTestu(r.s,r.m)}, ${esc(r.test||"")}, ${data(r.data)}`:`${e.bezPoziomu?"":esc(F.poziomy[r.poziom].n)+", "}${r.pkt}/${r.max} pkt (${r.proc}%)${r.ocena?`, ocena ${r.ocena}`:""}, podpowiedzi: ${r.podp||0}${r.trening?`, treningi: ${r.trening}`:""}, ${data(r.data)}${proby(r)}`)
      +` <button data-reset="${e.id}" title="Usuń wynik – uczeń zrobi etap od nowa">✕ usuń wynik</button>`:"<span class='mute'>nie rozpoczęto</span>"}</div>`}).join("")}</div></div></div>`;
  const st=$("[data-st]",b);
  $("[data-pin]",b).onclick=async()=>{if(!confirm(`Zresetować PIN ucznia ${g.n}? Przy następnym logowaniu ustawi nowy PIN, postęp zostaje.`))return;
    if(await akcja("resetPin",{n:g.n,k:g.k},st))st.textContent="✔ PIN zresetowany. Uczeń loguje się z nowym PIN-em."};
  $("[data-usun]",b).onclick=async()=>{if(!confirm(`Usunąć ucznia ${g.n} (${g.k}) razem z całym postępem? Tego nie da się cofnąć.`))return;
    if(await akcja("usunGracza",{n:g.n,k:g.k},st)){D0.gracze.splice(D0.gracze.indexOf(g),1);D=filtruj();rysuj()}};
  $$("[data-reset]",b).forEach(x=>x.onclick=async()=>{const e=F.etapy.find(y=>y.id===x.dataset.reset);
    if(!confirm(`Usunąć wynik „${e.tytul.det}” ucznia ${g.n}? Uczeń zrobi ten etap od nowa, XP zostanie przeliczone.`))return;
    if(await akcja("resetEtapu",{n:g.n,k:g.k,etap:e.id},st)){await wczytaj();const g2=D.gracze.find(y=>y.n===g.n&&y.k===g.k);if(g2)szczegoly(g2)}});
  b.scrollIntoView({behavior:"smooth"});
}
function klasy(t){
  const sum={};D.gracze.forEach(g=>{sum[g.k]=sum[g.k]||{s:0,n:0};sum[g.k].s+=+g.xp||0;sum[g.k].n++});
  const MK=Object.keys(F.motywy);
  t.innerHTML=`<div class="karta"><p class="mute">Uczeń dołącza do klasy, wpisując jej kod. <b>Klimat domyślny</b> ustawia się uczniowi na start, a <b>klimaty włączone</b> to te, między którymi może się przełączać. Zmiany zapisuje przycisk przy klasie. Kody zmieniasz w arkuszu, karta „Klasy”.</p>
  <div class="przewin"><table><tr><th>Oddział</th><th>Kod klasy</th><th>Uczniów</th><th>Wspólny cel</th><th>Klimat domyślny</th><th>Klimaty włączone</th><th>Odblokowane do</th><th>Komunikat dla klasy</th><th></th></tr>
  ${D.klasy.map((k,i)=>{const gg=D.gracze.filter(g=>wGrupie(g,k)),s={s:gg.reduce((a,g)=>a+(+g.xp||0),0),n:gg.length},p=Math.min(100,Math.round((sum[k.k]||{s:0}).s/k.cel*100)),dm=k.dm&&k.dm.length?k.dm:MK;
    return `<tr data-k="${i}"><td><b>${esc(k.k)}</b><br><span class="mute">${k.g?"grupa "+esc(k.g):"cała klasa"}</span></td><td class="haslo" style="font-size:1rem">${esc(k.kod)}</td><td>${s.n}<br><span class="mute">śr. ${s.n?Math.round(s.s/s.n):0} XP</span></td>
    <td><input type="number" min="100" step="100" value="${k.cel}" data-cel style="width:6.5em"><div class="pasek" style="margin-top:4px"><i style="width:${p}%"></i></div><span class="mute">${s.s} XP (${p}%)</span></td>
    <td><select data-m>${MK.map(m=>`<option value="${m}" ${(k.m||"det")===m?"selected":""}>${esc(F.motywy[m].nazwa)}</option>`).join("")}</select></td>
    <td style="white-space:nowrap">${MK.map(m=>`<label style="display:block;margin:0 0 .15em"><input type="checkbox" data-dm="${m}" ${dm.includes(m)?"checked":""}> ${esc(F.motywy[m].nazwa)}</label>`).join("")}</td>
    <td><select data-od><option value="">wszystko</option>${F.etapy.map(e=>`<option value="${e.id}" ${k.od===e.id?"selected":""}>${esc(e.tytul.det)}</option>`).join("")}</select></td>
    <td><textarea data-kom rows="3" maxlength="500" style="width:15em;font:inherit;font-size:.85rem" placeholder="np. Jutro kartkówka!">${esc(k.kom||"")}</textarea></td>

    <td><button class="glowny" data-zap>Zapisz</button><div class="mute" data-st></div></td></tr>`}).join("")}
  </table></div></div>
  <div class="karta"><b>Komunikat do wszystkich klas</b><p class="mute">Zastępuje komunikaty wszystkich klas. Pusty = usuwa komunikaty. Uczeń zobaczy go jako wiadomość od Twojej postaci.</p>
  <p><textarea id="komW" rows="2" maxlength="500" style="width:100%;font:inherit"></textarea></p><p><button class="glowny" id="komWb">Wyślij do wszystkich</button> <span class="mute" id="komWs"></span></p></div>`;
  $("#komWb").onclick=async()=>{const kom=$("#komW").value.trim();if(!confirm(kom?"Wysłać ten komunikat do wszystkich klas?":"Usunąć komunikaty wszystkich klas?"))return;
    if(await akcja("komunikatWszystkim",{kom},$("#komWs"))){D.klasy.forEach(k=>k.kom=kom);rysuj()}};
  $$("tr[data-k]",t).forEach(tr=>{
    const k=D.klasy[+tr.dataset.k],st=$("[data-st]",tr);
    $("[data-m]",tr).onchange=e=>{const c=$(`[data-dm="${e.target.value}"]`,tr);if(c)c.checked=true};
    // kolumna „Pracownia” (blokada przez aplikację) ukryta – administrator blokuje aplikację w pracowni
    $("[data-zap]",tr).onclick=async()=>{
      const m=$("[data-m]",tr).value,wl=$$("[data-dm]",tr).filter(c=>c.checked).map(c=>c.dataset.dm);
      if(!wl.length){st.textContent="Włącz co najmniej jeden klimat.";return}
      if(!wl.includes(m)){st.textContent="Klimat domyślny musi być włączony.";return}
      const dm=wl.length===MK.length?[]:wl,cel=+$("[data-cel]",tr).value||k.cel,od=$("[data-od]",tr).value,kom=$("[data-kom]",tr).value.trim();
      if(await akcja("ustawKlase",{k:k.k,g:k.g||"",m,dm,cel,od,kom},st)){k.m=m;k.dm=dm;k.cel=cel;k.od=od;k.kom=kom}
    };
  });
}
function wyniki(t){
  const w=D.wyniki.slice().reverse();
  t.innerHTML=`<div class="karta"><p class="mute">Ostatnie wyniki kartkówek i sprawdzianów (te same co w karcie „Wyniki” arkusza). Uczeń wpisuje tu imię i nazwisko. Ocena wg skali szkolnej.</p><div class="przewin"><table><tr><th>Data</th><th>Uczeń</th><th>Klasa</th><th>Test</th><th>Wynik</th><th>Ocena</th><th>Błędne pytania</th><th></th></tr>
  ${w.map((r,i)=>`<tr><td class="mute">${data(r.d)}</td><td>${esc(r.n)}</td><td>${esc(r.k)}</td><td>${esc(r.t)}</td><td><b>${r.s}/${r.m}</b> <span class="mute">(${r.m?Math.round(r.s/r.m*100):0}%)</span></td><td><span class="oc">${ocenaTestu(r.s,r.m)}</span></td><td class="mute">${esc(r.z)}</td><td><button data-uw="${i}" title="Usuń ten wpis">🗑</button> <span class="mute" data-st></span></td></tr>`).join("")||`<tr><td colspan="8" class="mute">Brak wyników.</td></tr>`}
  </table></div></div>`;
  $$("[data-uw]",t).forEach(b=>b.onclick=async()=>{const r=w[+b.dataset.uw];if(!confirm(`Usunąć wpis: ${r.n}, ${r.t}?`))return;
    if(await akcja("usunWynik",{wiersz:r.w,n:r.n,t:r.t},b.nextElementSibling))await wczytaj()});
}
function zalegle(t){
  const odI=k=>{if(!k.od)return -1;return F.etapy.findIndex(e=>e.id===k.od)};
  const bloki=D.klasy.filter(k=>!filtr||k.k===filtr).map(k=>{
    const oi=odI(k),gr=D.gracze.filter(g=>wGrupie(g,k));
    if(!gr.length)return "";
    if(oi<0)return `<div class="karta"><h3>${esc(etyk(k))}</h3><p class="mute">Wszystkie etapy są odblokowane – zaległości liczę, gdy zaczniesz odblokowywać misje w „Prowadzeniu lekcji” (albo ustawisz „Odblokowane do” w zakładce Klasy).</p></div>`;
    const etapy=F.etapy.slice(0,oi+1).filter(e=>!e.niespodzianka);   // kartkówki-niespodzianki: zaległości w Prowadzeniu przy teście
    const wiersze=gr.map(g=>{const s=stanUcznia(g);const brak=etapy.filter(e=>!(e.typ==="test"?(s.testy||{})[e.id]:(s.misje||{})[e.id]));return {g,brak}}).filter(x=>x.brak.length)
      .sort((a,b)=>b.brak.length-a.brak.length||String(a.g.n).localeCompare(String(b.g.n),"pl"));
    return `<div class="karta"><h3>${esc(etyk(k))} <span class="mute">· odblokowane do: ${esc(F.etapy[oi].lekcja||F.etapy[oi].tytul.det)}</span></h3>
      ${wiersze.length?`<table><tr><th>Uczeń</th><th>Do zaliczenia</th></tr>${wiersze.map(x=>`<tr><td><b>${esc(x.g.n)}</b></td><td style="white-space:normal">${x.brak.map(e=>`<span class="oc" style="background:color-mix(in srgb,var(--zle) 18%,transparent);margin:0 .3em .2em 0;display:inline-block">${esc(e.lekcja||e.tytul.det)}${e===F.etapy[oi]?" (bieżąca)":""}</span>`).join("")}</td></tr>`).join("")}</table>`:`<p>✔ Wszyscy uczniowie mają zaliczone odblokowane etapy.</p>`}
      <p class="mute">Uczniów w klasie: ${gr.length}. Uczniowie bez konta w grze nie są tu widoczni.</p></div>`}).join("");
  t.innerHTML=`<div class="karta"><p class="mute">Kto nie zaliczył odblokowanych etapów. Zaległe misje można robić w domu – w grze są oznaczone jako „zaległa – do zaliczenia”. Filtr oddziału jak w zakładce Uczniowie.</p></div>${bloki||`<div class="karta mute">Brak uczniów.</div>`}`;
}
function hasla(t){
  t.innerHTML=`<div class="karta"><p class="mute">Kliknij hasło, aby je odsłonić (żeby nie było widać na rzutniku).</p><table><tr><th>Test</th><th>Hasło</th></tr>
  ${D.hasla.map(r=>`<tr><td>${esc(r[0])}</td><td><span class="haslo ukryte" tabindex="0">${esc(r[1])}</span></td></tr>`).join("")||`<tr><td colspan="2" class="mute">Brak haseł – uruchom funkcję przygotuj() w skrypcie.</td></tr>`}</table></div>`;
  $$(".ukryte",t).forEach(e=>e.onclick=e.onkeydown=()=>e.classList.toggle("ukryte"));
}
haslo?wczytaj():logowanie();
})();
</script>
</body>
</html>
