<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prowadzenie lekcji – Agencja</title>
<link rel="stylesheet" href="../tresc/klasa1/gra/gra.css">
<style>
#app{max-width:none;padding:0}
.pasekG{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid color-mix(in srgb,var(--tekst) 12%,transparent)}
.pasekG b{color:var(--akc)}
.pasekG select{font:inherit;padding:.4em;border-radius:8px;background:var(--tlo);color:var(--tekst);border:1px solid color-mix(in srgb,var(--tekst) 25%,transparent)}
.kroki{display:flex;gap:6px;flex-wrap:wrap}
.kroki button{background:var(--panel2);border:0;border-radius:999px;padding:.45em 1em;font-weight:600}
.kroki button[aria-pressed=true]{background:var(--akc);color:#111}
.ekran{padding:24px clamp(16px,4vw,60px);min-height:calc(100vh - 64px)}
.duzy{font-size:clamp(1.1rem,1.6vw,1.6rem)}
.duzy h1{font-size:clamp(2rem,4vw,3.4rem);margin:.1em 0}
.temat{color:var(--akc2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.odprawa{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.scenaP .dymek{margin:14px 0}
.scenaP .chmurka{font-size:clamp(1.05rem,1.5vw,1.45rem);max-width:none}
.scenaP .narrator{font-size:clamp(1rem,1.4vw,1.35rem);max-width:none}
.scenaP .dymek{animation:wskocz .35s cubic-bezier(.2,1.4,.4,1)}
.misjaInfo{background:var(--panel);border:2px solid var(--akc);border-radius:16px;padding:20px}
.misjaInfo ul{margin:.4em 0 .8em;padding-left:1.2em}
.poz3{display:grid;gap:8px;margin-top:10px}
.poz3 div{background:var(--panel2);border-radius:10px;padding:8px 12px}
.ramkaT{display:flex;flex-direction:column;height:calc(100vh - 64px)}
.ramkaT .nawT{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--panel2);flex-wrap:wrap}
.ramkaT .nawT b{flex:1}
.ramkaT iframe{flex:1;border:0;width:100%;background:#fff}
.czyt{flex:1;overflow:auto;padding:22px 20px 60px;line-height:1.65}
.czytW{max-width:46em;margin:0 auto}.czytW h2{color:var(--akc);font-size:1.5em;margin:0 0 .5em}.czytW p{margin:0 0 .9em}
.czytW b{color:var(--akc)}.czytW code{font:700 .95em Consolas,monospace;background:#000;color:var(--akc2,#4cc9f0);border:1px solid color-mix(in srgb,var(--akc2,#4cc9f0) 45%,transparent);border-radius:6px;padding:.05em .4em;white-space:nowrap}
.czytP,.czytZ{border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--panel)}
.czytP{border-left:5px solid var(--akc)}.czytP button{font-size:.75em;margin-left:8px}.czytP #odpT{margin-top:8px}
.czytZ{font-size:.85em;border:1px dashed color-mix(in srgb,var(--tekst) 30%,transparent)}.czytZ ul{margin:.4em 0 0;padding-left:1.2em}
.ostrz{background:#7c2d12;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;margin-bottom:14px}
.liczniki{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px}
.liczniki div{background:var(--panel);border-radius:12px;padding:10px 16px;min-width:140px}
.liczniki b{display:block;font-size:2rem;color:var(--akc)}
.tabela td,.tabela th{white-space:nowrap}
.st-ok{color:#86efac;font-weight:700}.st-tr{color:#fde68a;font-weight:700}.st-nie{color:var(--mute)}
.trudne li{margin:.3em 0}
.haslo-duze{font-family:Consolas,monospace;font-size:clamp(3rem,10vw,8rem);font-weight:800;letter-spacing:.15em;color:var(--akc);text-align:center;margin:.2em 0}
.login{max-width:440px;margin:60px auto}
.ranking-duzy .tabela{font-size:clamp(1rem,1.5vw,1.4rem)}
.planL{display:grid;gap:10px;margin-top:14px}
.planP{display:grid;grid-template-columns:44px 120px 200px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-size:1.05rem}
.planP:hover{border-color:var(--akc2)}
.planP .nr{font-size:1.6rem;font-weight:800;color:var(--akc)}
.planP .kl small{display:block}
.planP.biez{border-color:var(--akc);box-shadow:0 0 0 4px color-mix(in srgb,var(--akc) 25%,transparent)}
.bz-chipy{display:flex;flex-wrap:wrap;gap:8px}.bz-chipy span{background:var(--panel2);border-radius:999px;padding:.3em 1em}
.duzy .bz-kol li{font-size:1.25em}
body:has(#obec) .pasekG{padding-right:290px}
#obec{position:fixed;right:12px;top:8px;z-index:30;background:var(--panel);border:1px solid color-mix(in srgb,var(--tekst) 20%,transparent);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:340px}
.obec-g{display:flex;gap:4px}.obec-g button{background:none;border:0;padding:8px 10px;font-weight:700}
.obec-l{max-height:50vh;overflow:auto;padding:0 12px 10px;display:grid;gap:3px}
#toasty{position:fixed;right:12px;top:60px;z-index:31;display:grid;gap:6px}
.toastP{background:#7c2d12;color:#fff;border-radius:10px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pojaw .2s}
.planP .teraz{background:var(--akc);color:#111;font-weight:800;border-radius:999px;padding:.2em .8em}
@media (max-width:900px){.odprawa{grid-template-columns:1fr}}
</style>
</head>
<body data-m="det">
<div id="app"></div>
<script src="../tresc/klasa1/gra/fabula.js"></script>
<script src="../tresc/klasa1/gra/fabula-mundur.js"></script>
<script src="../tresc/klasa1/gra/rozdzial2.js"></script>
<script src="../tresc/klasa2/gra/fabula.js"></script>
<script src="../tresc/klasa2/gra/rozdzial1.js"></script>
<script src="../tresc/klasa1/gra/postacie.js"></script>
<script src="../tresc/klasa1/gra/burza.js"></script>
<script src="../tresc/klasa1/gra/konsola.js"></script>
<script src="../tresc/klasa1/gra/animacje-sieci.js"></script>
<script src="../tresc/klasa1/gra/animacje-systemy.js"></script>
<script src="../tresc/klasa1/gra/teczki.js"></script>
<script>
(function(){
"use strict";
const Fakt=()=>{const k=K(),r=k&&String(k.k)[0];return window.FABULY[r]||window.FABULY[1]};   // fabuła klasy wybranej z planu
const F=new Proxy({},{get:(t,p)=>Fakt()[p]});
let API="https://script.google.com/macros/s/AKfycbzGvnKlock74eu0ptTr8Dy7O7BKdnQBL2V8B9vFoSWcl80k3ZLd06R1tBz8m82dQPKySw/exec";
try{const q=new URLSearchParams(location.search).get("api");if(q&&/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(q))API=q}catch(e){}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
async function api(a,d){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},d,{a}))});const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error("stary")}}
let haslo="",D=null,klasa=null,etapI=1,krok="plan",timer=null,dzienPl=null,teoriaNr=null;
try{haslo=sessionStorage.getItem("agencja-panel")||"";const z=JSON.parse(sessionStorage.getItem("agencja-prow")||"{}");if(z.k)klasa=z.k;if(z.e!=null)etapI=z.e}catch(e){}
const zapamietaj=()=>{try{sessionStorage.setItem("agencja-prow",JSON.stringify({k:klasa,e:etapI}))}catch(e){}};

/* klasa = „oddział|grupa”, np. „1C|2”; pusta grupa = cała klasa */
const klucz=k=>k.k+"|"+(k.g||"");
const etyk=k=>k.k+(k.g?" gr "+k.g:"");
const wGrupie=(g,k)=>g.k===k.k&&String(g.g||"")===String(k.g||"");
const K=()=>D&&D.klasy.find(k=>klucz(k)===klasa);
const motyw=()=>{const k=K();return k&&F.motywy[k.m]?k.m:"det"};
const M=()=>F.motywy[motyw()];
const tok=t=>String(t).replace(/\{(\w+)\}/g,(w,k)=>M()[k]!=null?M()[k]:w);
const E=()=>F.etapy[etapI];
const tytul=e=>e.tytul[motyw()]||e.tytul.det;
const odIdx=k=>{if(!k||!k.od)return F.etapy.length-1;const i=F.etapy.findIndex(e=>e.id===k.od);return i<0?F.etapy.length-1:i};
const nastepny=k=>{if(!k||!k.od)return 1;const i=F.etapy.findIndex(e=>e.id===k.od);return Math.min(F.etapy.length-1,(i<0?0:i)+1)};   // podpowiedź: lekcja po ostatnio odblokowanej
const stan=g=>{try{return JSON.parse(g.stan||"{}")}catch(e){return {}}};
function ocenaTestu(sk,mx){const p=Math.round((+sk||0)/(+mx||1)*100);for(const [g,o] of F.skalaTestow)if(p>=g)return o;return "1"}
function nazwaTestu(id){const m=/^k(\d)(\d)([abk])$/.exec(id);if(!m)return id;return `Klasa ${m[1]} · Rozdział ${m[2]} · ${m[3]==="k"?"kartkówka":"sprawdzian "+m[3].toUpperCase()}`}
const grupaZPlanu=t=>{const m=/^(\d)([a-z]+?)l?(\d)\/(\d)$/i.exec(String(t||"").trim());return m?{k:(m[1]+m[2]).toUpperCase(),g:m[3],nr:+m[1]}:null};
const MATERIALY={1:"../tresc/klasa1/klasa1-informatyka-efekty.html",2:"../tresc/klasa2/klasa2-informatyka-efekty.html"};   // klasy z materiałami w aplikacji
const GRA_KLASY=Object.keys(window.FABULY).map(Number);   // klasy, dla których jest gra
const DNI=["","Poniedziałek","Wtorek","Środa","Czwartek","Piątek"];

/* ---------- logowanie ---------- */
function logowanie(msg){
  document.body.dataset.m="det";
  app.innerHTML=`<form class="karta login"><h2>Prowadzenie lekcji</h2><p class="mala">Zaloguj się hasłem do panelu nauczyciela.</p>
    <p><input type="password" name="h" placeholder="Hasło nauczyciela" style="width:100%;padding:.6em;border-radius:10px;font:inherit" autocomplete="current-password"></p>
    <p><button class="glowny">Zaloguj</button></p><p class="blad">${esc(msg||"")}</p></form>`;
  const f=$("form");f.h.focus();f.onsubmit=e=>{e.preventDefault();haslo=f.h.value;wczytaj(true)};
}
async function wczytaj(pierwszy){
  try{
    const r=await api("panel",{haslo});
    if(!r.ok){if(pierwszy)return logowanie({haslo:"Złe hasło.",brakHasla:"Najpierw ustaw hasło w arkuszu (Ustawienia, B1).",blokada:"Za dużo prób. Odczekaj 10 minut."}[r.e]||"Błąd logowania.");return}
    try{sessionStorage.setItem("agencja-panel",haslo)}catch(e){}
    D=r;D.plan=D.plan||[];if(!K())klasa=D.klasy[0]?klucz(D.klasy[0]):null;
    if(pierwszy)rysuj();else if(krok==="podglad")podglad();
  }catch(e){if(pierwszy)logowanie(e.message==="stary"?"Zaktualizuj skrypt w arkuszu.":"Brak połączenia z arkuszem.")}
}

/* ---------- szkielet ---------- */
function kroki(){
  const e=E();
  return e.typ==="test"
    ?(e.gra?[["odprawa","1. Informacja"],["uruchomT","2. Uruchom i wyniki"],["koniec","3. Ranking"]]
      :[["odprawa","1. Informacja"],["haslo","2. Hasło do testu"],["podglad","3. Wyniki na żywo"],["koniec","4. Ranking"]])
    :[["odprawa","1. Odprawa"],["teoria","2. Teoria"],["podglad","3. Misja – podgląd na żywo"],["koniec","4. Ranking"]];
}
const pelny=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
function rysuj(){
  if(etapI>=F.etapy.length)etapI=Math.min(1,F.etapy.length-1);
  clearInterval(timer);timer=null;
  setTimeout(obecnosc,0);
  if(krok==="plan"||krok==="planEdycja"||krok==="teoriaK"){
    document.body.dataset.m="det";
    app.innerHTML=`<div class="pasekG"><b>Prowadzenie lekcji</b><button class="drugi" id="doPlanu">📅 Plan</button>
      ${krok==="teoriaK"?`<b style="color:var(--tekst)">Teoria · ${esc(teoriaNr.etyk)}</b>`:""}<span style="flex:1"></span>
      <button class="drugi" id="wybor">Wybór ręczny klasy i lekcji</button><button class="drugi" id="pelny" title="Pełny ekran">⛶</button></div><div id="ekran"></div>`;
    $("#doPlanu").onclick=()=>{krok="plan";rysuj()};$("#pelny").onclick=pelny;
    $("#wybor").onclick=()=>{krok="odprawa";rysuj()};
    return ({plan:planDnia,planEdycja:edycjaPlanu,teoriaK:teoriaKlasy})[krok]();
  }
  document.body.dataset.m=motyw();
  const k=K(),oi=odIdx(k),e=E();
  const odbl=etapI<=oi, stanOdb=!k?"":!k.od?"wszystkie etapy odblokowane":`odblokowane do: ${esc(F.etapy[oi].lekcja||tytul(F.etapy[oi]))}`;
  app.innerHTML=`<div class="pasekG">
    <button class="drugi" id="doPlanu" title="Plan dnia">📅</button>
    <select id="selK" aria-label="Klasa i grupa">${D.klasy.map(x=>`<option value="${esc(klucz(x))}" ${klucz(x)===klasa?"selected":""}>${esc(etyk(x))}</option>`).join("")}</select>
    <select id="selE" aria-label="Lekcja">${F.etapy.map((x,i)=>`<option value="${i}" ${i===etapI?"selected":""}>${esc(x.lekcja||x.id)} – ${esc(tytul(x))}</option>`).join("")}</select>
    <div class="kroki">${kroki().map(([id,n])=>`<button data-k="${id}" aria-pressed="${krok===id}">${n}</button>`).join("")}</div>
    <span style="flex:1"></span>
    ${(()=>{const bez=k&&k.g?D.gracze.filter(g=>g.k===k.k&&!g.g).length:0;return bez?`<span class="blad" style="font-weight:700" title="Przypisz grupy w panelu (Uczniowie → kolumna Grupa)">⚠ ${bez} uczniów ${esc(k.k)} bez grupy</span>`:""})()}
    <span class="mala">${stanOdb}</span>
    ${e.gra?"":odbl&&k&&k.od?`<span class="st-ok">✔ odblokowane</span>`:`<button class="glowny" id="odblokuj">🔓 Odblokuj: ${esc(tytul(e))}</button>`}
    <button class="drugi" id="burzaB" aria-pressed="${krok==="burza"}" title="Ćwiczenie zespołowe: uczniowie w 3 drużynach zbierają skojarzenia">👥 Burza mózgów</button>
    <button class="drugi" id="veyonB" title="Skopiuj polecenie, które w Veyon („Uruchom program”) otworzy grę na pełnym ekranie u uczniów">📋 Polecenie dla Veyon</button>
    ${k&&APLIKACJA_W_PRACOWNI?przyciskPracowni(k):""}
    <button class="drugi" id="pelny" title="Pełny ekran">⛶</button>
  </div><div id="ekran"></div>`;
  $("#doPlanu").onclick=()=>{krok="plan";rysuj()};
  $("#selK").onchange=ev=>{klasa=ev.target.value;if(etapI>=F.etapy.length)etapI=nastepny(K());zapamietaj();rysuj()};
  $("#selE").onchange=ev=>{etapI=+ev.target.value;krok="odprawa";zapamietaj();rysuj()};
  $$(".kroki button").forEach(b=>b.onclick=()=>{krok=b.dataset.k;rysuj()});
  $("#pelny").onclick=pelny;
  const ob=$("#odblokuj");if(ob)ob.onclick=odblokuj;
  const pr=$("#pracownia");if(pr)pr.onclick=przelaczPracownie;
  $("#burzaB").onclick=()=>{krok="burza";rysuj()};
  $("#veyonB").onclick=kopiujVeyon;
  ({odprawa,teoria,podglad,koniec,haslo:hasloTestu,burza:burzaEkran,uruchomT:uruchomTest})[krok]();
}

async function odblokuj(){
  const k=K(),e=E();if(!k)return;
  const oi=odIdx(k);
  if(!k.od&&!confirm(`${etyk(k)} ma teraz odblokowane wszystkie etapy. Po kliknięciu uczniowie będą mieli dostęp tylko do etapów do „${tytul(e)}” włącznie (kolejne odblokujesz na następnych lekcjach). Kontynuować?`))return;
  if(k.od&&etapI<=oi)return;
  const b=$("#odblokuj");b.disabled=true;b.textContent="Odblokowuję…";
  try{const r=await api("ustawKlase",{haslo,k:k.k,g:k.g||"",m:k.m,dm:k.dm||[],cel:k.cel,od:e.id});
    if(r.ok){k.od=e.id;if(krok!=="podglad"&&krok!=="haslo")krok=e.typ==="test"?"haslo":"podglad";rysuj()}
    else{b.disabled=false;b.textContent=r.e==="zajety"?"Arkusz zajęty – kliknij ponownie":"Błąd: "+r.e}}
  catch(er){b.disabled=false;b.textContent="Brak połączenia – kliknij ponownie"}
}

/* ---------- blokada komputerów w pracowni (aplikacja .exe: pełny ekran z grą) ---------- */
// Wyłączone: administrator szkoły blokuje uruchamianie aplikacji w pracowni – grę na pełnym ekranie otwiera Veyon (kopiujVeyon).
const APLIKACJA_W_PRACOWNI=false;
const odblokowanaPr=k=>k&&k.odb>Date.now();
const godz=t=>new Date(t).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
function przyciskPracowni(k){
  return odblokowanaPr(k)
    ?`<button class="drugi" id="pracownia" title="Komputery tej grupy działają normalnie. Kliknij, aby znów włączyć pełny ekran z grą.">🔓 Komputery odblokowane do ${godz(k.odb)}</button>`
    :`<button class="drugi" id="pracownia" title="W czasie lekcji aplikacja w pracowni pokazuje tylko grę na pełnym ekranie. Kliknij, aby uczniowie mogli korzystać z innych programów.">🔒 Komputery zablokowane</button>`;
}
async function przelaczPracownie(){
  const k=K();if(!k)return;
  const wl=odblokowanaPr(k),b=$("#pracownia");b.disabled=true;b.textContent="Zapisuję…";
  try{const r=await api("blokadaPracowni",{haslo,k:k.k,g:k.g||"",wl});
    if(r.ok){k.odb=r.odb||0;rysuj()}
    else{b.disabled=false;b.textContent=r.e==="akcja"?"Zaktualizuj skrypt w arkuszu":r.e==="zajety"?"Arkusz zajęty – kliknij ponownie":"Błąd: "+r.e}}
  catch(er){b.disabled=false;b.textContent="Brak połączenia – kliknij ponownie"}
}
function oknoUcznia(s){   // gdzie uczeń gra i ile razy wyszedł z okna gry w ciągu ostatnich 50 minut
  const od=Date.now()-50*60e3,wsz=(s.alarmy||[]).filter(a=>a.t>=od),al=wsz.filter(a=>!a.c),cmd=wsz.filter(a=>a.c),sr=s.srod&&s.srod.t>=od-10*60e3?s.srod:null;
  const gdzie=sr?(sr.p?`<span title="Aplikacja w pracowni – pełny ekran">🔒</span>`:`<span title="Zwykła przeglądarka – bez blokady">🌐</span>`):"";
  const ile=al.length?`<span class="blad" style="font-weight:700" title="${esc(al.map(a=>`${godz(a.t)}${a.s!=null?` (${a.s} s)`:" (nadal poza oknem)"}`).join(", "))}">⚠ ${al.length}× poza oknem</span>`:"";
  const kons=cmd.length?`<span title="Wyjścia do Wiersza polecenia w zadaniach z konsolą: ${esc(cmd.map(a=>`${godz(a.t)}${a.s!=null?` (${a.s} s)`:""}`).join(", "))}">🖥 ${cmd.length}×</span>`:"";
  return `${gdzie} ${ile} ${kons}`;
}

/* ---------- burza mózgów: losowanie drużyn, liderzy, pomysły na żywo, wyniki (wspólne funkcje w burza.js) ---------- */
let BZ=null,bzDet=false;
const BU=()=>window.BURZA;
const bzApi=(op,d)=>{const k=K();return api("burzaN",Object.assign({haslo,op,k:k.k,g:k.g||""},d))};
const bzBledy={zajety:"Arkusz zajęty – kliknij ponownie.",akcja:"Zaktualizuj skrypt w arkuszu (burza mózgów wymaga nowej wersji).",wpisy:"Drużyny już zbierają pomysły – nie można losować od nowa.",haslo:"Złe hasło."};
const zImionami=b=>b.w.map(w=>Object.assign({},w,{a:(b.u[w.a]||{}).n||""}));
async function burzaEkran(){
  const w=$("#ekran");if(!w||!K())return;
  if(!BZ||BZ.kl!==klasa){
    w.innerHTML=`<div class="ekran"><p class="mala">Wczytuję…</p></div>`;

/* ---------- obecność na żywo: kto jest teraz w grze (gra wysyła stan okna co ~10 s) ---------- */
// 🟢 w grze · 🟡 poza grą (inny program) · 🖥 w Wierszu polecenia (zadanie z konsolą) · 🔴 gra zamknięta · ⚪ nie otworzył gry.
// Gdy ktoś wyjdzie z gry albo ją zamknie – komunikat i krótki dźwięk (można wyciszyć). Lista nazwisk domyślnie zwinięta (demonstracja Veyon).
const OBc={o:{},prev:{},teraz:0,kl:"",cisza:false,otw:false};

const stanOb=n=>{const x=OBc.o[n];return !x?"brak":OBc.teraz-x.t>35000?"zamk":x.st};
const lekcyjny=()=>K()&&!["plan","planEdycja","teoriaK"].includes(krok);
async function obecnosc(){
  if(!D||!lekcyjny())return rysujObecnosc();
  const k=K(),n=D.gracze.filter(g=>wGrupie(g,k)).map(g=>String(g.n));
  try{const r=await api("obecni",{haslo,k:k.k,n});if(!r.ok)return;
    OBc.o=r.o;OBc.teraz=r.teraz;

    OBc.prev=nowe;OBc.kl=klasa;rysujObecnosc()}catch(e){}
}
function pisk(){if(OBc.cisza)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18);setTimeout(()=>c.close(),400)}catch(e){}}
function komunikat(html){let b=$("#toasty");if(!b){b=document.createElement("div");b.id="toasty";document.body.appendChild(b)}
  const d=document.createElement("div");d.className="toastP";d.innerHTML=html;b.appendChild(d);setTimeout(()=>d.remove(),9000)}

function duplikaty(lista){const m={},out={};
  lista.forEach(({g,s})=>Object.entries(s.dane||{}).forEach(([k,v])=>{if(!["ip","mac","nazwa"].includes(k))return;const kl=k+"|"+String(v).toUpperCase().replace(/[^0-9A-Z.]/g,"");(m[kl]=m[kl]||[]).push(String(g.n))}));
  Object.entries(m).forEach(([kl,ns])=>{if(ns.length<2)return;const nazwa={ip:"adres IP",mac:"adres MAC",nazwa:"nazwę komputera"}[kl.split("|")[0]];

function parsujPlan(t){
  const wynik=[];let d=0;const linie=String(t).split(/\r?\n/).map(x=>x.trim());
  const dni={"poniedziałek":1,"poniedzialek":1,"wtorek":2,"środa":3,"sroda":3,"czwartek":4,"piątek":5,"piatek":5};
  for(let i=0;i<linie.length;i++){
    const l=linie[i],dn=dni[l.toLowerCase().split(/\s/)[0]];
    if(dn&&l.split(/\s+/).length<=2){d=dn;continue}
    const m=/^(\d{1,2})\s+(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})\s+(\S+)/.exec(l);
    if(m&&d){let przed="",sala="";const nast=linie.slice(i+1,i+3).find(x=>x.includes("·"));if(nast){[przed,sala]=nast.split("·").map(x=>x.trim())}
      wynik.push([d,+m[1],m[2]+"–"+m[3],m[4],przed,sala||""])}
  }
  return wynik;
}

  }
  w.innerHTML=`<div class="ekran"><div class="ostrz">⚠ Ten ekran zawiera wyniki uczniów – wyłącz demonstrację Veyon, zanim go otworzysz.</div>

    ${wiersze.map(x=>`<tr><td><b>${esc(x.g.n)}</b></td>${x.html}<td>${x.okno}</td></tr>`).join("")||`<tr><td colspan="8" class="mala">Brak uczniów w tej klasie.</td></tr>`}</table></div>

  const kk=K(),top=D.gracze.filter(g=>kk&&g.k===kk.k).sort((a,b)=>(+b.xp||0)-(+a.xp||0)).slice(0,15);

  w.innerHTML=`<div class="ekran duzy"><div class="temat">${esc(e.lekcja||"")}</div><h1>Ranking klasy ${esc(kk?kk.k:"")}</h1>
    <div class="ranking-duzy misjaInfo" style="max-width:900px">
    <table class="tabela"><tr><th>#</th><th>Agent</th><th>Stopień</th><th>XP</th></tr>${top.map((g,i)=>`<tr><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${esc(g.n)}</td><td>${esc(stopien(+g.xp||0))}</td><td>${+g.xp||0}</td></tr>`).join("")||`<tr><td colspan="4" class="mala">Brak wyników.</td></tr>`}</table></div></div>`;
}

haslo?wczytaj(true):logowanie();
})();
